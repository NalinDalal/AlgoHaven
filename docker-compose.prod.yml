services:
  db:
    image: postgres:16
    container_name: algohaven-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-algohaven}
    volumes:
      - algohaven_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.0.11
    container_name: algohaven-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  be:
    build:
      context: .
      dockerfile: apps/be/Dockerfile
    container_name: algohaven-be
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-algohaven}
      WORKER_SECRET: ${WORKER_SECRET}
      WORKER_URL: http://worker:3002
      BE_URL: http://be:3001
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-algohaven_session}
      SESSION_TTL_MS: ${SESSION_TTL_MS:-604800000}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - "${BE_PORT:-3001}:3001"

  fe:
    build:
      context: .
      dockerfile: apps/fe/Dockerfile
      args:
        NEXT_PUBLIC_BE_URL: ${NEXT_PUBLIC_BE_URL}
    container_name: algohaven-fe
    restart: unless-stopped
    depends_on:
      - be
    ports:
      - "${FE_PORT:-3000}:3000"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: algohaven-worker
    restart: unless-stopped
    depends_on:
      - be
      - redis
    environment:
      BE_URL: http://be:3001
      WORKER_SECRET: ${WORKER_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${WORKER_PORT:-3002}:3002"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  ws:
    build:
      context: .
      dockerfile: apps/ws/Dockerfile
    container_name: algohaven-ws
    restart: unless-stopped
    depends_on:
      - be
      - redis
    environment:
      BE_URL: http://be:3001
      WS_PORT: "3003"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - "${WS_PORT:-3003}:3003"

volumes:
  algohaven_data:
  redis_data:
