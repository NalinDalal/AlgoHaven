name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/${{ secrets.EC2_USERNAME }}/AlgoHaven

            # Pull latest code
            git pull origin main

            # Copy env file (or use the one already on the server)
            # cp /home/${{ secrets.EC2_USERNAME }}/AlgoHaven/.env.example /home/${{ secrets.EC2_USERNAME }}/AlgoHaven/.env

            # Build and restart all services
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml build --no-cache
            docker compose -f docker-compose.prod.yml up -d

            # Run Prisma migrations
            docker compose -f docker-compose.prod.yml exec -T be bunx prisma migrate deploy --schema=../../packages/db/prisma/schema.prisma

            # Clean up unused images
            docker image prune -f
